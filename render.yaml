services:
  - type: web
    name: feedforge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Remotion video rendering with Chrome and FFmpeg requires at least 1-2GB RAM
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FEEDFORGE_VISUALS
        value: stock
      - key: FEEDFORGE_ECONOMY
        value: "1"
      - key: FEEDFORGE_CAPTION_ALIGN
        value: estimate
      - key: FEEDFORGE_WORKERS
        value: "1"
      - key: REMOTION_CONCURRENCY
        value: "1"
      - key: FEEDFORGE_ALLOWED_ORIGINS
        value: "*"
      - key: FEEDFORGE_LLM_MODEL
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.6-flash,gemini-3.5-flash,gemini-3.7-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.8-flash
      - key: FEEDFORGE_TTS_MODEL
        value: gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts,gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts
      - key: GOOGLE_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
